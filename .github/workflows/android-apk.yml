name: Android APK

on:
  push:
    branches: [main]
    # Pushes that only touch the UX board (deployed to GitHub Pages by
    # deploy_ux_board.yml) do not change the app: no APK build.
    paths-ignore:
      - "docs/**"
      - "test/screenshots/**"
      - "tool/update_ux_board.py"
      - ".github/workflows/deploy_ux_board.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk cube-mentor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CubeMentor build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: cube-mentor.apk
